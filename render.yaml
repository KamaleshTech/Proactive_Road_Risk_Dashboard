services:
  - type: web
    name: proactive-road-risk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_PATH
        value: data/road_risk.db
      - key: CORS_ORIGINS
        value: http://localhost:5173
