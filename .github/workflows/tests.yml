name: tests

on:
  push:
    branches: [main, feature/showcase-mvp, kanish/data-audit, feature/showcase-on-default]
  pull_request:
    branches: [main, kanish/data-audit]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
